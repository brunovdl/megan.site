<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#8a6cf5"/>
      <stop offset="0.55" stop-color="#5b3cc4"/>
      <stop offset="1" stop-color="#3a2390"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2420"/>
      <stop offset="1" stop-color="#22140f"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1f73"/>
      <stop offset="1" stop-color="#1e1350"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1c39f"/>
      <stop offset="1" stop-color="#e4ab84"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1024" height="1024"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- fundo -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="470" r="330" fill="#ffffff" opacity="0.07"/>
    <circle cx="512" cy="470" r="250" fill="#ffffff" opacity="0.06"/>

    <!-- cabelo de trás (longo, ondulado) -->
    <path d="M330 420
             C320 280 400 215 512 215
             C624 215 704 280 694 420
             C690 520 720 600 760 690
             C700 740 620 730 600 700
             L424 700
             C404 730 324 740 264 690
             C304 600 334 520 330 420 Z" fill="url(#hair)"/>

    <!-- ombros / blazer -->
    <path d="M150 1024
             C160 860 260 780 400 752
             L512 800 L624 752
             C764 780 864 860 874 1024 Z" fill="url(#blazer)"/>
    <!-- blusa -->
    <path d="M430 745 L512 880 L594 745 L560 735 L512 790 L464 735 Z" fill="#f4f0ff"/>
    <!-- lapelas -->
    <path d="M400 752 L512 900 L470 1024 L380 1024 L350 800 Z" fill="#3a2a8a"/>
    <path d="M624 752 L512 900 L554 1024 L644 1024 L674 800 Z" fill="#3a2a8a"/>
    <!-- broche ✨ -->
    <path d="M690 880 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8 z" fill="#ffd166"/>

    <!-- pescoço -->
    <path d="M462 610 L462 750 C480 790 544 790 562 750 L562 610 Z" fill="#dda07a"/>
    <path d="M462 690 C490 720 534 720 562 690 L562 640 L462 640 Z" fill="#c98d68" opacity="0.5"/>

    <!-- orelhas -->
    <ellipse cx="358" cy="470" rx="26" ry="40" fill="#e4ab84"/>
    <ellipse cx="666" cy="470" rx="26" ry="40" fill="#e4ab84"/>

    <!-- rosto -->
    <path d="M362 430
             C362 310 430 262 512 262
             C594 262 662 310 662 430
             C662 560 590 660 512 660
             C434 660 362 560 362 430 Z" fill="url(#skin)"/>

    <!-- franja lateral -->
    <path d="M345 440
             C330 300 420 228 520 232
             C620 236 690 300 680 430
             C650 360 600 320 540 312
             C500 360 430 395 345 440 Z" fill="url(#hair)"/>
    <path d="M520 250 C570 255 620 285 645 330" stroke="#5a3a33" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- sobrancelhas -->
    <path d="M410 418 C430 402 462 400 484 410" stroke="#2b1a16" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M540 410 C562 400 594 402 614 418" stroke="#2b1a16" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- olhos -->
    <ellipse cx="448" cy="468" rx="22" ry="27" fill="#2b1a16"/>
    <ellipse cx="576" cy="468" rx="22" ry="27" fill="#2b1a16"/>
    <circle cx="456" cy="459" r="8" fill="#ffffff"/>
    <circle cx="584" cy="459" r="8" fill="#ffffff"/>
    <circle cx="442" cy="478" r="3.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="570" cy="478" r="3.5" fill="#ffffff" opacity="0.8"/>
    <!-- cílios -->
    <path d="M424 452 L412 444" stroke="#2b1a16" stroke-width="7" stroke-linecap="round"/>
    <path d="M600 452 L612 444" stroke="#2b1a16" stroke-width="7" stroke-linecap="round"/>

    <!-- bochechas -->
    <ellipse cx="420" cy="540" rx="34" ry="20" fill="#f08a8a" opacity="0.45"/>
    <ellipse cx="604" cy="540" rx="34" ry="20" fill="#f08a8a" opacity="0.45"/>

    <!-- nariz -->
    <path d="M508 505 C503 522 505 532 518 532" stroke="#c98d68" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- sorriso -->
    <path d="M466 574 C490 606 534 606 558 574 C540 584 484 584 466 574 Z" fill="#a8344a"/>
    <path d="M478 580 C500 590 524 590 546 580 C530 584 494 584 478 580 Z" fill="#ffffff"/>

    <!-- headset: arco -->
    <path d="M352 455 C340 270 430 205 512 205 C594 205 684 270 672 455"
          stroke="#ffffff" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M352 455 C340 270 430 205 512 205 C594 205 684 270 672 455"
          stroke="#cfc3ff" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- fones -->
    <rect x="318" y="420" width="64" height="104" rx="30" fill="#ffffff"/>
    <rect x="332" y="436" width="36" height="72" rx="18" fill="#7b5cf0"/>
    <rect x="642" y="420" width="64" height="104" rx="30" fill="#ffffff"/>
    <rect x="656" y="436" width="36" height="72" rx="18" fill="#7b5cf0"/>
    <!-- microfone -->
    <path d="M352 515 C360 600 410 630 456 626" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="446" y="610" width="40" height="30" rx="15" fill="#ffd166"/>

    <!-- brilhos ✨ -->
    <path d="M790 230 l18 52 52 18 -52 18 -18 52 -18 -52 -52 -18 52 -18 z" fill="#ffd166"/>
    <path d="M868 380 l9 26 26 9 -26 9 -9 26 -9 -26 -26 -9 26 -9 z" fill="#ffffff" opacity="0.9"/>
    <path d="M200 300 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 z" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
